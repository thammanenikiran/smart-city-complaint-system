{% extends "base.html" %}

{% block title %}Citizen Help Chatbot{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-robot"></i>
                        Smart City Citizen Help
                    </h4>
                </div>

                <div id="chatBox"
                     class="card-body"
                     style="height: 450px; overflow-y: auto;">

                    <div class="mb-3">
                        <div class="alert alert-light border">
                            🤖 <strong>Assistant:</strong>
                            Hello! 👋 I can help you with complaints,
                            departments, complaint tracking and status.
                            How can I help you?
                        </div>
                    </div>

                </div>

                <div class="card-footer">

                    <div class="input-group">

                        <input type="text"
                               id="messageInput"
                               class="form-control"
                               placeholder="Type your question..."
                               autocomplete="off">

                        <button class="btn btn-primary"
                                onclick="sendMessage()">
                            <i class="bi bi-send"></i>
                            Send
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const chatBox = document.getElementById("chatBox");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    // Show citizen message
    chatBox.innerHTML += `
        <div class="mb-3 text-end">
            <div class="d-inline-block bg-primary text-white rounded p-2">
                ${message}
            </div>
        </div>
    `;

    input.value = "";

    // Send message to Flask
    try {

        const response = await fetch("/chatbot/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        // Show chatbot response
        chatBox.innerHTML += `
            <div class="mb-3">
                <div class="alert alert-light border">
                    🤖 <strong>Assistant:</strong>
                    ${data.reply}
                </div>
            </div>
        `;

        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {

        chatBox.innerHTML += `
            <div class="mb-3">
                <div class="alert alert-danger">
                    Unable to connect to the chatbot.
                </div>
            </div>
        `;

    }
}


// Press Enter to send
document.getElementById("messageInput")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

{% endblock %}
